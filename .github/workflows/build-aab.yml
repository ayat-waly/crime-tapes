name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [android-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build AAB (signed when the keystore secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::No keystore secrets: building an UNSIGNED test bundle"
          fi
          gradle --no-daemon :app:bundleRelease

      - name: Check signature
        run: |
          f=$(ls app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$f" | tail -1 || true
          keytool -printcert -jarfile "$f" | grep -E 'Owner|SHA1' || echo "UNSIGNED"

      - uses: actions/upload-artifact@v4
        with:
          name: crime-tapes-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
