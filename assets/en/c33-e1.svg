<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Two messages, two aims</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfc4a7" stroke-width=".5"/></pattern></defs><rect width="1200" height="900" fill="#473b2e"/><rect x="28" y="28" width="1144" height="844" fill="#eee4c9"/><rect x="45" y="45" width="1110" height="810" fill="url(#grid)"/><path d="M70 156H1130" stroke="#8c3c2e" stroke-width="4"/><text x="70" y="93" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">CRIME TAPES  /  33-E1</text><text x="1130" y="93" font-family="Arial,sans-serif" font-size="21" fill="#342e25" text-anchor="end" direction="ltr">INVESTIGATION FILE EXHIBIT</text><text x="70" y="137" font-family="Arial,sans-serif" font-size="34" fill="#342e25" text-anchor="start" direction="ltr">Two messages, two aims</text><rect x="70" y="190" width="1060" height="560" rx="4" fill="#faf3df" stroke="#b5a17c"/><text x="105" y="240" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">08:43, Noura’s phone to Rasha: “I am well and left voluntarily. Do not</text><text x="105" y="283" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">report before 10:00; I am going to the samples committee as agreed.”</text><text x="105" y="326" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">09:18, office workstation to director: “She will not leave until she</text><text x="105" y="369" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">cancels the review and leaves the samples. Do not contact the committee.” A</text><text x="105" y="412" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">photograph was attached. Noura’s phone went offline at 09:06 after her live</text><text x="105" y="455" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">09:05 call; disconnection alone does not explain why.</text><path d="M70 788H1130" stroke="#a38b59"/><text x="70" y="829" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">Full text and source context are available in the exhibit description.</text></svg>