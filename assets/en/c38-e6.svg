<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>Pier boundary</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfc4a7" stroke-width=".5"/></pattern></defs><rect width="1200" height="900" fill="#473b2e"/><rect x="28" y="28" width="1144" height="844" fill="#eee4c9"/><rect x="45" y="45" width="1110" height="810" fill="url(#grid)"/><path d="M70 156H1130" stroke="#8c3c2e" stroke-width="4"/><text x="70" y="93" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">CRIME TAPES  /  38-E6</text><text x="1130" y="93" font-family="Arial,sans-serif" font-size="21" fill="#342e25" text-anchor="end" direction="ltr">INVESTIGATION FILE EXHIBIT</text><text x="70" y="137" font-family="Arial,sans-serif" font-size="34" fill="#342e25" text-anchor="start" direction="ltr">Pier boundary</text><rect x="70" y="190" width="1060" height="560" rx="4" fill="#faf3df" stroke="#b5a17c"/><text x="105" y="240" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">The lock is intact; the current plan shows the barrier continuing to the</text><text x="105" y="283" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">rocks. Field examination confirms no alternative pedestrian route from pier</text><text x="105" y="326" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">to building during the period. The lock photograph alone would not</text><text x="105" y="369" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="ltr">establish this.</text><path d="M70 788H1130" stroke="#a38b59"/><text x="70" y="829" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">Full text and source context are available in the exhibit description.</text></svg>