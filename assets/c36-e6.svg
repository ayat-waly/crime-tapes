<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>تسليم 22:03</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfc4a7" stroke-width=".5"/></pattern></defs><rect width="1200" height="900" fill="#473b2e"/><rect x="28" y="28" width="1144" height="844" fill="#eee4c9"/><rect x="45" y="45" width="1110" height="810" fill="url(#grid)"/><path d="M70 156H1130" stroke="#8c3c2e" stroke-width="4"/><text x="70" y="93" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">CRIME TAPES  /  36-E6</text><text x="1130" y="93" font-family="Arial,sans-serif" font-size="21" fill="#342e25" text-anchor="start" direction="rtl">سجل مرفق بملف التحقيق</text><text x="1130" y="137" font-family="Arial,sans-serif" font-size="34" fill="#342e25" text-anchor="start" direction="rtl">تسليم 22:03</text><rect x="70" y="190" width="1060" height="560" rx="4" fill="#faf3df" stroke="#b5a17c"/><text x="1095" y="240" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">06 [36-E06] — مشهد التسليم 22:03: آلاء تعد رزمة بجوار إذن 114، ونهلة</text><text x="1095" y="283" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">تستلمها وتضعها في حقيبتها. لا يظهر مندوب. رشا ترى التسليم وتؤكد أنه</text><text x="1095" y="326" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">المبلغ المثبت في الإذن، لا رزمة منفصلة.</text><path d="M70 788H1130" stroke="#a38b59"/><text x="1130" y="829" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="rtl">النص الكامل والمرجع متاحان في وصف الدليل.</text></svg>