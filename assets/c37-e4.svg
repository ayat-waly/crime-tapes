<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><title>سجل التشغيل</title><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#cfc4a7" stroke-width=".5"/></pattern></defs><rect width="1200" height="900" fill="#473b2e"/><rect x="28" y="28" width="1144" height="844" fill="#eee4c9"/><rect x="45" y="45" width="1110" height="810" fill="url(#grid)"/><path d="M70 156H1130" stroke="#8c3c2e" stroke-width="4"/><text x="70" y="93" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="ltr">CRIME TAPES  /  37-E4</text><text x="1130" y="93" font-family="Arial,sans-serif" font-size="21" fill="#342e25" text-anchor="start" direction="rtl">سجل مرفق بملف التحقيق</text><text x="1130" y="137" font-family="Arial,sans-serif" font-size="34" fill="#342e25" text-anchor="start" direction="rtl">سجل التشغيل</text><rect x="70" y="190" width="1060" height="560" rx="4" fill="#faf3df" stroke="#b5a17c"/><text x="1095" y="240" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">04 [37-E04] سجل التشغيل: «19:12 غطاء: طارق. 19:13 تحرير منصة: ندى +</text><text x="1095" y="283" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">طارق. 19:17 تثبيت منصة: ندى + طارق». لكل موافقة تسجيل مرئي من محطة</text><text x="1095" y="326" font-family="Arial,sans-serif" font-size="29" fill="#342e25" text-anchor="start" direction="rtl">صاحبها في اللحظة نفسها.</text><path d="M70 788H1130" stroke="#a38b59"/><text x="1130" y="829" font-family="Arial,sans-serif" font-size="23" fill="#342e25" text-anchor="start" direction="rtl">النص الكامل والمرجع متاحان في وصف الدليل.</text></svg>